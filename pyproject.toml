[project]
name = "enterprise-ai-assistant"
version = "1.0.0"
description = "Enterprise AI Assistant with LangGraph, durable memory, and local RAG"
requires-python = ">=3.10,<3.15"
dependencies = [
  "streamlit>=1.46", "langchain>=1.0", "langgraph>=1.0", "langchain-google-genai>=4.0",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "redis>=6.0", "pydantic-settings>=2.10",
  "python-dotenv>=1.1", "pypdf>=5.0", "python-docx>=1.1", "structlog>=25.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
